name: Health Check

on:
  schedule:
    - cron: "0 */12 * * *" # Every 12 hours (saves Actions minutes)
  workflow_dispatch: # Manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check AEGIS health
        run: |
          set -euo pipefail

          echo "=== AEGIS ==="
          HEALTH=$(curl -fsS https://aegis.nexlyadvisory.com/api/health)
          echo "$HEALTH" | python3 -m json.tool
          STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" != "ok" ]; then
            echo "AEGIS health: $STATUS"
            exit 1
          fi

          echo ""
          echo "=== Nexly ==="
          curl -fsS -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" https://nexlyadvisory.com
