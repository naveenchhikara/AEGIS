name: Deploy Production

# DEAD PIPELINE — deliberately unreachable. Do not restore the tag trigger.
#
# This workflow deploys to the pre-2026-08-23 VPS layout: it ships a git bundle
# over scp and runs deploy-prod.sh, which bootstraps its own Docker Compose
# stack into /opt/aegis. That machine was reprovisioned and no longer exists in
# that form. The box now runs Coolify, whose `coolify-proxy` holds ports 80 and
# 443 for every site on it, so a run that got far enough to bind those ports
# would contend with the proxy serving aegis.nexlyadvisory.com,
# nexlyadvisory.com and sapiex.tech.
#
# AEGIS deploys by merging to `main`; Coolify builds and releases automatically.
# There is no tag step.
#
# The trigger is removed here rather than only disabling the workflow in the
# Actions UI, because that toggle is repository state, not repository content:
# it survives no fork or restore, anyone with write access can flip it back,
# and it was flipped back at least once (2026-08-26). workflow_dispatch keeps
# the file runnable on purpose, by a human who has read this comment, if the
# old pipeline is ever needed for reference.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Unit test
        run: pnpm vitest run
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create git bundle
        run: |
          mkdir -p dist
          git bundle create dist/aegis.bundle --all

      - name: Copy deployment helpers to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "dist/aegis.bundle,deploy/server/*,deploy/systemd/*"
          target: "/tmp/aegis-deploy-${{ github.run_id }}"
          strip_components: 1

      - name: Deploy tagged release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            chmod +x /tmp/aegis-deploy-${{ github.run_id }}/server/*.sh
            sudo bash /tmp/aegis-deploy-${{ github.run_id }}/server/bootstrap-prod.sh /tmp/aegis-deploy-${{ github.run_id }}/aegis.bundle /opt/aegis
            sudo bash /tmp/aegis-deploy-${{ github.run_id }}/server/deploy-prod.sh ${{ github.ref_name }} /tmp/aegis-deploy-${{ github.run_id }}/aegis.bundle /opt/aegis

      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "--- Container status ---"
            docker ps --filter name=aegis --format 'table {{.Names}}\t{{.Status}}'
            echo ""
            echo "--- Health endpoint ---"
            HEALTH=$(curl -fsS http://127.0.0.1:3000/api/health)
            echo "$HEALTH" | python3 -m json.tool
            STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            if [ "$STATUS" != "ok" ]; then
              echo "FATAL: health status is $STATUS"
              exit 1
            fi
            echo ""
            echo "--- Current release ---"
            cat /opt/aegis/shared/current-release

      - name: Cleanup deploy temp files
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sudo rm -rf /tmp/aegis-deploy-${{ github.run_id }}
